<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="400" height="400">
  <!-- Drop-cap ground: a four-fold arabesque. One half-quadrant of scrolling vine is
       drawn once, mirrored across the diagonal, then rotated into all four corners.
       Used as a CSS mask, so only its shape matters; colour comes from the page. -->
  <defs>
    <path id="leaf" d="M0 0 C2.5 -3.4 7.5 -3.4 10 0 C7.5 3.4 2.5 3.4 0 0 Z" />
    <g id="half" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round">
      <!-- main scroll: from the centre, out along the edge, curling into a volute -->
      <path d="M45 48 C37 48 30 45 25 39 C19 32 10 33 9 40 C8.5 45.5 14 47.5 16.3 43.8 C17.7 41.4 15.2 39.2 13.3 40.6" />
      <!-- corner scroll: meets its mirror image to form a lyre in the corner -->
      <path d="M25 39 C20 28 12 23 8.5 14 C6.8 9.5 9.8 6.6 12.6 8.4" />
      <!-- inner tendril -->
      <path d="M20 34.5 C21 29 25 26.5 28.5 28 C30.8 29 30 32 28 31.6" stroke-width="0.8" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(35 46.8) rotate(22) scale(0.75)" fill="#000" stroke="none" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(11.5 27) rotate(-100) scale(0.75)" fill="#000" stroke="none" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(18 44.8) rotate(160) scale(0.6)" fill="#000" stroke="none" />
      <circle cx="4.6" cy="30" r="1" fill="#000" stroke="none" />
      <circle cx="27.5" cy="40.5" r="0.8" fill="#000" stroke="none" />
    </g>
    <g id="quarter">
      <use href="#half" xlink:href="#half" />
      <use href="#half" xlink:href="#half" transform="matrix(0 1 1 0 0 0)" />
    </g>
  </defs>
  <use href="#quarter" xlink:href="#quarter" />
  <use href="#quarter" xlink:href="#quarter" transform="rotate(90 50 50)" />
  <use href="#quarter" xlink:href="#quarter" transform="rotate(180 50 50)" />
  <use href="#quarter" xlink:href="#quarter" transform="rotate(270 50 50)" />
  <!-- central rosette -->
  <circle cx="50" cy="50" r="3.6" fill="none" stroke="#000" stroke-width="0.8" />
  <circle cx="50" cy="50" r="1.3" fill="#000" />
  <!-- hairline frame -->
  <rect x="0.6" y="0.6" width="98.8" height="98.8" fill="none" stroke="#000" stroke-width="0.8" />
</svg>
